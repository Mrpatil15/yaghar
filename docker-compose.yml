services:
  reactivation-app:
    build: .
    container_name: dead_lead_studio
    restart: always
    ports:
      - "8501:8501"
    volumes:
      # Persist SQLite database across container restarts
      - ./dead_leads.db:/app/dead_leads.db
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
